name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:naming
      - run: pnpm typecheck
      - run: pnpm test:focused
      - run: node examples/basic-agent.mjs
      - run: npm pack --dry-run --json

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24.15.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:naming
      - run: pnpm typecheck
      - run: pnpm test
      - run: node examples/basic-agent.mjs
      - run: npm pack --dry-run --json
