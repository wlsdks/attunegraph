name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:naming
      - run: pnpm typecheck
      - run: pnpm test:focused
      - run: pnpm test:performance
      - run: pnpm benchmark:performance -- --scale=10000 --profile=portable --concurrency=1 --warmups=0 --repetitions=1 --output=/tmp/attunegraph-performance-smoke.json
      - run: pnpm test:readiness
      - run: pnpm verify:working-graph-golden
      - run: node examples/basic-agent.mjs
      - run: npm pack --dry-run --json

  readiness-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:readiness

  readiness-attestation-contract:
    if: github.event_name == 'push'
    needs: readiness-contract
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      # v7.0.1 is pinned because checkout bytes are part of the provenance producer chain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Bundle the versioned readiness producer contract
        run: tar -czf readiness-producer-contract.tgz scripts/readiness-check-contracts.mjs scripts/capture-attunegraph-readiness.mjs scripts/score-attunegraph-readiness.mjs
      # v4.1.1 is pinned because this action defines the external attestation trust boundary.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: readiness-producer-contract.tgz

  clean-room-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:clean-room-consumer

  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24.15.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:naming
      - run: pnpm typecheck
      - run: pnpm test:cross-platform
      - run: node examples/basic-agent.mjs
      - run: npm pack --dry-run --json

  local-profile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        node: ["24.15.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run local-profile tests on a reviewed filesystem
        env:
          TMPDIR: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
        run: pnpm test:local-profile
