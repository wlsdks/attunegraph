<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AttuneGraph agent evidence flow</title>
  <desc id="desc">Host-owned sources become an exact-head temporal and provenance graph, then a bounded decision query returns complete, partial, or abstained evidence with a receipt.</desc>
  <style>
    .canvas { fill: #f8fafc; stroke: #e2e8f0; }
    .card { fill: #ffffff; stroke: #cbd5e1; }
    .title { fill: #0f172a; font: 700 26px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .heading { fill: #0f172a; font: 700 17px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .body { fill: #475569; font: 500 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .chipText { fill: #334155; font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { fill: #64748b; font: 600 11px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .06em; }
    .arrow { stroke: #64748b; stroke-width: 2; fill: none; }
    .node { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
    .edge { stroke: #818cf8; stroke-width: 2; }
    .accent { fill: #4f46e5; }
    .accentText { fill: #ffffff; font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .good { fill: #dcfce7; stroke: #22c55e; }
    .warn { fill: #fef3c7; stroke: #f59e0b; }
    .stop { fill: #fee2e2; stroke: #ef4444; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0f172a; stroke: #334155; }
      .card { fill: #111827; stroke: #475569; }
      .title, .heading { fill: #f8fafc; }
      .body { fill: #cbd5e1; }
      .small { fill: #94a3b8; }
      .arrow { stroke: #94a3b8; }
      .node { fill: #1e1b4b; stroke: #818cf8; }
      .edge { stroke: #6366f1; }
      .good { fill: #052e16; }
      .warn { fill: #451a03; }
      .stop { fill: #450a0a; }
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="canvas" x="1" y="1" width="1198" height="358" rx="24"/>
  <text class="title" x="48" y="52">From changing sources to bounded agent evidence</text>
  <text class="body" x="48" y="77">Raw content stays with the host. AttuneGraph owns only the relationships needed for time, provenance, replay, and safe decisions.</text>

  <rect class="card" x="48" y="108" width="240" height="202" rx="18"/>
  <text class="small" x="70" y="138">HOST-OWNED</text>
  <text class="heading" x="70" y="166">Authoritative sources</text>
  <rect x="70" y="187" width="88" height="30" rx="15" fill="#e0f2fe" stroke="#38bdf8"/>
  <text class="chipText" x="89" y="207">notes</text>
  <rect x="166" y="187" width="98" height="30" rx="15" fill="#e0f2fe" stroke="#38bdf8"/>
  <text class="chipText" x="186" y="207">tools</text>
  <rect x="70" y="227" width="88" height="30" rx="15" fill="#e0f2fe" stroke="#38bdf8"/>
  <text class="chipText" x="90" y="247">apps</text>
  <rect x="166" y="227" width="98" height="30" rx="15" fill="#e0f2fe" stroke="#38bdf8"/>
  <text class="chipText" x="184" y="247">files</text>
  <text class="body" x="70" y="286">bytes · parsing · credentials</text>

  <path class="arrow" d="M288 209 H342" marker-end="url(#arrowhead)"/>

  <rect class="card" x="350" y="108" width="250" height="202" rx="18"/>
  <text class="small" x="372" y="138">ATTUNEGRAPH</text>
  <text class="heading" x="372" y="166">Exact-head evidence graph</text>
  <line class="edge" x1="405" y1="213" x2="475" y2="190"/>
  <line class="edge" x1="475" y1="190" x2="548" y2="220"/>
  <line class="edge" x1="405" y1="213" x2="467" y2="259"/>
  <line class="edge" x1="467" y1="259" x2="548" y2="220"/>
  <circle class="node" cx="405" cy="213" r="12"/>
  <circle class="node" cx="475" cy="190" r="12"/>
  <circle class="node" cx="548" cy="220" r="12"/>
  <circle class="node" cx="467" cy="259" r="12"/>
  <text class="body" x="372" y="291">valid time · recorded time · source</text>

  <path class="arrow" d="M600 209 H654" marker-end="url(#arrowhead)"/>

  <rect class="card" x="662" y="108" width="218" height="202" rx="18"/>
  <text class="small" x="684" y="138">ONE FIXED QUERY</text>
  <text class="heading" x="684" y="166">Decision boundary</text>
  <rect x="684" y="188" width="174" height="31" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text class="chipText" x="699" y="208">scope + exact head</text>
  <rect x="684" y="228" width="174" height="31" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text class="chipText" x="699" y="248">time + freshness</text>
  <rect x="684" y="268" width="174" height="31" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text class="chipText" x="699" y="288">token + work budget</text>

  <path class="arrow" d="M880 209 H934" marker-end="url(#arrowhead)"/>

  <rect class="card" x="942" y="108" width="210" height="202" rx="18"/>
  <text class="small" x="964" y="138">AGENT-READY</text>
  <text class="heading" x="964" y="166">Explicit outcome</text>
  <rect class="good" x="964" y="187" width="166" height="30" rx="15"/>
  <text class="body" x="1018" y="207">complete</text>
  <rect class="warn" x="964" y="226" width="166" height="30" rx="15"/>
  <text class="body" x="1024" y="246">partial</text>
  <rect class="stop" x="964" y="265" width="166" height="30" rx="15"/>
  <text class="body" x="1015" y="285">abstained</text>
  <rect class="accent" x="1036" y="314" width="116" height="28" rx="14"/>
  <text class="accentText" x="1056" y="333">sealed receipt</text>
</svg>
